const RZCAP={pl:'plan pierwotny',real:'realizacja',pct:'% wykonania planu (realizacja ÷ plan, tylko miesiące zamknięte)',dev:'odchylenie od planu w zł (realizacja − plan, tylko miesiące zamknięte)',devp:'odchylenie od planu w % ((realizacja − plan) ÷ plan)',fc:'prognoza (realizacja za miesiące zamknięte + plan)'};
function rzTable(v,mode){const rows=rzis(v),L=v.last,cmp=['pct','dev','devp'].includes(mode),key=mode==='real'?'re':mode==='fc'?'fc':'pl';
 const sum=a=>a.reduce((x,y)=>x+(y||0),0),sL=a=>a.slice(0,L).reduce((x,y)=>x+(y||0),0);
 const one=(x,y)=>mode==='pct'?(y?Math.round(x/y*100)+'%':'–'):mode==='dev'?f0(x-y):(y?((x-y)/y*100).toFixed(1).replace('.',',')+'%':'–');
 const T=(cs)=>agg(rows,cs,cmp?'re':key),B=(cs)=>agg(rows,cs,'pl');
 const cells=(a,b)=>cmp?a.map((_,i)=>`<td>${i<L?one(a[i],b[i]):'–'}</td>`).join('')+`<td>${one(sL(a),sL(b))}</td>`:a.map(x=>`<td class="${x<0?'neg':''}">${f0(x)}</td>`).join('')+`<td>${f0(sum(a))}</td>`;
 const line=(lab,cs,cl)=>`<tr class="${cl||''}"><th class="l" scope="row">${lab}</th>${cells(T(cs),B(cs))}</tr>`;
 const acc=(cs)=>rows.filter(r=>cs.includes(r.c)).map(r=>{const a=(cmp?r.re:r[key]).map(x=>x??0);return`<tr><th class="l" scope="row">${esc(r.k)}</th>${cells(a,r.pl)}</tr>`}).join('');
 const wyn=(lab,plus,minus)=>{const g=(k)=>{const z=Array(12).fill(0);plus.forEach(c=>agg(rows,c,k).forEach((x,i)=>z[i]+=x));minus.forEach(c=>agg(rows,c,k).forEach((x,i)=>z[i]-=x));return z};return`<tr class="t"><th class="l" scope="row">${lab}</th>${cells(g(cmp?'re':key),g('pl'))}</tr>`};
 return`<div class="wrap"><table><caption>RZiS 2026 – ${RZCAP[mode]}${cmp?'; ostatni miesiąc zamknięty: '+MN[L-1]+'; kolumna „Razem” = od stycznia do '+MN[L-1]:', zł'}</caption><thead><tr><th class="l" scope="col">Pozycja</th>${MN.map(m=>`<th scope="col">${m.slice(0,3)}</th>`).join('')}<th scope="col">${cmp?'Razem do '+MN[L-1].slice(0,3):'Razem'}</th></tr></thead><tbody>
 ${line('A. Przychody ze sprzedaży',['P'],'s')}${acc(['P'])}${line('B. Koszty działalności operacyjnej',['K'],'s')}${acc(['K'])}
 ${wyn('C. Zysk (strata) ze sprzedaży',[['P']],[['K']])}${line('D. Pozostałe przychody operacyjne',['OP'],'s')}${acc(['OP'])}${line('E. Pozostałe koszty operacyjne',['OK'],'s')}${acc(['OK'])}
 ${wyn('F. Zysk z działalności operacyjnej',[['P'],['OP']],[['K'],['OK']])}${line('H. Koszty finansowe',['FK'],'s')}${acc(['FK'])}${wyn('L. Zysk (strata) netto',[['P'],['OP']],[['K'],['OK'],['FK']])}</tbody></table></div>`}

 <tr class="t"><th class="l" scope="row">Razem</th>${MN.map((_,i)=>`<td>${f0(v.mpk.reduce((a,p)=>a+M[p.k][i],0))}</td>`).join('')}<td>${f0(c.mpk)}</td></tr></tbody></table></div>

function readForm(o){const F=new FormData($('#of')),g=k=>F.get(k),t=o.id?o.t:g('t');
 const b=Object.assign({},o,{id:o.id,t,rd:g('rd'),nz:String(g('nz')||'').trim()});
 if(t==='e'){Object.assign(b,{gr:g('gr'),m:g('em'),ppk:!!g('e_ppk')});['zas','st','fu','sp','ng','ns','og','wy','na','ch','po'].forEach(k=>b[k]=num(g('e_'+k)))}
 else if(t==='u'){const hh=String(g('u_h')||'').split(';').map(num);while(hh.length<12)hh.push(0);Object.assign(b,{rod:g('u_rod'),gr:g('u_gr'),m:g('u_m'),stawka:num(g('u_st')),h:hh.slice(0,12),ppk:!!g('u_ppk')});delete b.kt;delete b.f;delete b.al}
 else if(t==='x'){const vv=String(g('x_v')||'').split(';').map(num);while(vv.length<12)vv.push(0);Object.assign(b,{kind:g('x_kind'),gr:g('x_gr'),m:g('x_m'),v:vv.slice(0,12)})}
 else if(t==='g'){gRead(F,b);const ht=g('ht');if(ht==='tpl')delete b.h;else b.h=hRead(g,b);b.ix={p:num(g('ip')),m:num(g('im'))};b.al=asRead(g,V());delete b.kt;delete b.f}
 else{b.kt=String(g('kt')||'').trim();const fh=String(g('fh')||'').trim(),of=o.f||{};
  b.f=Object.assign({},of,{t:g('ft'),g:num(g('fg')),s:num(g('fs')),mi:g('fm'),x:String(g('fx')||'')});
  if(fh===''&&b.f.t==='hist')b.f.auto=true;else{b.f.auto=false;b.f.h=num(fh)}
